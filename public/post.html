<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시글 · BoxTick</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/board.css">
  <script src="/js/common.js"></script>
  <script src="/js/board-common.js"></script>
</head>
<body data-stage="shield">
  <div id="site-header"></div>
  <main class="container board-main post-main">
    <a class="btn btn--ghost post-back on-stage" href="/board.html" id="back-link">◀ 목록</a>

    <article class="panel post-article" id="post" aria-labelledby="post-title" hidden>
      <div class="panel-head"><span id="post-category"></span><span class="num" id="post-number"></span></div>
      <h1 class="post-title" id="post-title"></h1>
      <div class="post-meta">
        <span id="post-author" class="post-meta__author"></span>
        <span id="post-date" class="num"></span>
        <span id="post-views" class="num"></span>
      </div>
      <div class="post-content" id="post-content"></div>
      <div class="post-actions" id="post-actions" hidden>
        <a class="btn btn--secondary" id="edit-link" href="#" hidden>수정</a>
        <button class="btn btn--danger" type="button" id="delete-post" hidden>삭제</button>
      </div>
    </article>
    <div class="empty-state" id="post-status" role="status">게시글을 불러오는 중입니다.</div>

    <section class="panel comments" id="comments" aria-labelledby="comments-title" hidden>
      <div class="panel-head"><h2 id="comments-title">댓글</h2><span class="num" id="comment-count">0</span></div>
      <ul class="comment-list" id="comment-list"></ul>

      <form class="comment-form" id="comment-form" novalidate hidden>
        <label class="visually-hidden" for="comment-content">댓글 입력</label>
        <textarea class="textarea" id="comment-content" name="content" maxlength="1000" rows="3" placeholder="댓글을 남겨보세요"></textarea>
        <p class="field-error" id="content-error"></p>
        <div class="comment-form__foot">
          <span class="text-small text-muted num" id="comment-length">0 / 1000</span>
          <button class="btn btn--primary" type="submit">댓글 등록</button>
        </div>
      </form>
      <p class="comment-login" id="comment-login" hidden>댓글을 쓰려면 <a id="comment-login-link" href="/login.html">로그인</a>해 주세요.</p>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/post.js"></script>
</body>
</html>
