<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원 관리 · BoxTick</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/admin-catalog.css">
  <link rel="stylesheet" href="/css/admin-manage.css">
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin-manage.js"></script>
</head>
<body data-stage="neutral">
  <div id="site-header"></div>
  <main class="container admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <section class="admin-catalog" aria-labelledby="admin-title">
      <div class="admin-head">
        <div>
          <h1 class="page-title" id="admin-title"><span class="page-title__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></span>회원 관리</h1>
          <p class="page-sub">회원을 찾아 정보를 확인하고 이용을 정지하거나 해제합니다.</p>
        </div>
      </div>

      <div class="admin-workspace">
        <section class="panel admin-list-panel" aria-labelledby="list-title">
          <div class="panel-head"><h2 id="list-title">회원 목록</h2><span id="result-count">-</span></div>
          <form class="manage-toolbar" id="search-form" role="search">
            <label class="visually-hidden" for="q">아이디 · 닉네임 검색</label>
            <input class="input" id="q" name="q" type="search" placeholder="아이디 · 닉네임 검색" maxlength="50">
            <button class="btn btn--primary" type="submit">검색</button>
          </form>
          <ul class="round-select manage-filter" id="status-filter" aria-label="상태 필터"></ul>
          <div class="admin-record-list" id="item-list" aria-live="polite"><div class="loading-state">불러오는 중…</div></div>
          <div class="manage-pager">
            <button class="btn btn--secondary" type="button" id="prev-page">◀ 이전</button>
            <span class="chip num" id="page-label">1 / 1</span>
            <button class="btn btn--secondary" type="button" id="next-page">다음 ▶</button>
          </div>
        </section>

        <section class="panel admin-editor" id="detail-panel" aria-labelledby="detail-title">
          <div class="panel-head"><h2 id="detail-title">회원 정보</h2><span id="detail-state">-</span></div>
          <div id="detail-empty" class="empty-state">목록에서 회원을 선택하세요.</div>
          <div id="detail" class="manage-detail" hidden>
            <p class="manage-detail__name" id="detail-name"></p>
            <table class="stat-table">
              <tbody>
                <tr><th scope="row">번호</th><td id="detail-id"></td></tr>
                <tr><th scope="row">아이디</th><td id="detail-username"></td></tr>
                <tr><th scope="row">권한</th><td id="detail-role"></td></tr>
                <tr><th scope="row">상태</th><td id="detail-status"></td></tr>
                <tr><th scope="row">가입일</th><td id="detail-joined"></td></tr>
                <tr><th scope="row">작성 글</th><td id="detail-posts"></td></tr>
              </tbody>
            </table>
            <p class="manage-note text-small" id="detail-note" hidden></p>
            <div class="admin-form-actions">
              <a class="btn btn--secondary" id="detail-posts-link" href="/admin/posts.html">작성 글 보기</a>
              <button class="btn btn--danger" type="button" id="status-button">이용 정지</button>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/admin-users.js"></script>
</body>
</html>
