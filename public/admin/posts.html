<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시글 관리 · BoxTick</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/admin-catalog.css">
  <link rel="stylesheet" href="/css/admin-manage.css">
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin-manage.js"></script>
  <script src="/js/board-common.js"></script>
</head>
<body data-stage="neutral">
  <div id="site-header"></div>
  <main class="container admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <section class="admin-catalog" aria-labelledby="admin-title">
      <div class="admin-head">
        <div>
          <h1 class="page-title" id="admin-title"><span class="page-title__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4V4z"/></svg></span>게시글 관리</h1>
          <p class="page-sub">전체 게시글을 확인하고 공지를 쓰거나 부적절한 글을 삭제합니다.</p>
        </div>
        <a class="btn btn--primary" href="/write.html?category=notice">공지 쓰기</a>
      </div>

      <div class="admin-workspace">
        <section class="panel admin-list-panel" aria-labelledby="list-title">
          <div class="panel-head"><h2 id="list-title">게시글 목록</h2><span id="result-count">-</span></div>
          <form class="manage-toolbar" id="search-form" role="search">
            <label class="visually-hidden" for="q">제목 · 내용 검색</label>
            <input class="input" id="q" name="q" type="search" placeholder="제목 · 내용 검색" maxlength="50">
            <button class="btn btn--primary" type="submit">검색</button>
          </form>
          <ul class="round-select manage-filter" id="category-filter" aria-label="카테고리 필터"></ul>
          <p class="manage-author-filter" id="author-filter" hidden></p>
          <div class="admin-record-list" id="item-list" aria-live="polite"><div class="loading-state">불러오는 중…</div></div>
          <div class="manage-pager">
            <button class="btn btn--secondary" type="button" id="prev-page">◀ 이전</button>
            <span class="chip num" id="page-label">1 / 1</span>
            <button class="btn btn--secondary" type="button" id="next-page">다음 ▶</button>
          </div>
        </section>

        <section class="panel admin-editor" id="detail-panel" aria-labelledby="detail-title">
          <div class="panel-head"><h2 id="detail-title">게시글 정보</h2><span id="detail-state">-</span></div>
          <div id="detail-empty" class="empty-state">목록에서 게시글을 선택하세요.</div>
          <div id="detail" class="manage-detail" hidden>
            <div class="row" id="detail-chip"></div>
            <p class="manage-detail__name" id="detail-name"></p>
            <table class="stat-table">
              <tbody>
                <tr><th scope="row">작성자</th><td id="detail-author"></td></tr>
                <tr><th scope="row">작성일</th><td id="detail-date"></td></tr>
                <tr><th scope="row">조회</th><td id="detail-views"></td></tr>
                <tr><th scope="row">댓글</th><td id="detail-comments"></td></tr>
              </tbody>
            </table>
            <div class="admin-form-actions">
              <a class="btn btn--secondary" id="detail-author-link" href="#">작성자 글만</a>
              <a class="btn btn--secondary" id="detail-view-link" href="#">글 보기</a>
              <button class="btn btn--danger" type="button" id="delete-button">삭제</button>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/admin-posts.js"></script>
</body>
</html>
