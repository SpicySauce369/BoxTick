<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카드 관리 · BoxTick</title>
  <link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/css/admin-catalog.css">
  <script src="/js/common.js"></script><script src="/js/admin.js"></script>
</head>
<body data-stage="neutral" data-admin-catalog="cards">
  <div id="site-header"></div>
  <main class="container admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <section class="admin-catalog" aria-labelledby="admin-title">
      <div class="admin-head">
        <div>
          <h1 class="page-title" id="admin-title"><span class="page-title__icon" aria-hidden="true">▤</span>카드 관리</h1>
          <p class="page-sub">카드 메타데이터와 소속 세트를 관리합니다.</p>
        </div>
        <button class="btn btn--primary" type="button" data-new>새 카드</button>
      </div>

      <div class="admin-workspace">
        <section class="panel admin-list-panel" aria-labelledby="card-list-title">
          <div class="panel-head"><h2 id="card-list-title">카드 목록</h2><span id="result-count">-</span></div>
          <div class="admin-toolbar admin-toolbar--cards">
            <input class="input" id="list-search" type="search" placeholder="카드 이름·번호 검색" aria-label="카드 검색">
            <select class="select" id="list-set-filter" aria-label="세트 필터"><option value="">전체 세트</option></select>
          </div>
          <div id="item-list" class="admin-record-list"><div class="loading-state">불러오는 중…</div></div>
        </section>

        <section class="panel admin-editor" aria-labelledby="editor-title">
          <div class="panel-head"><h2 id="editor-title">새 카드</h2><span id="editor-state">NEW</span></div>
          <form id="editor-form" class="admin-form" novalidate>
            <input type="hidden" name="id">
            <div class="admin-form-grid">
              <div class="field"><label for="set_id">세트 *</label><select class="select" id="set_id" name="set_id" required><option value="">세트 선택</option></select><div class="field-error" id="set_id-error"></div></div>
              <div class="field"><label for="rarity">희귀도</label><input class="input" id="rarity" name="rarity" placeholder="예: AR, SAR"><div class="field-error" id="rarity-error"></div></div>
            </div>
            <div class="field"><label for="name">카드 이름 *</label><input class="input" id="name" name="name" maxlength="100" required><div class="field-error" id="name-error"></div></div>
            <div class="admin-form-grid">
              <div class="field"><label for="card_number">카드 번호</label><input class="input" id="card_number" name="card_number" placeholder="001/100"><div class="field-error" id="card_number-error"></div></div>
              <div class="field"><label for="external_id">외부 ID</label><input class="input" id="external_id" name="external_id" autocomplete="off"><div class="field-error" id="external_id-error"></div></div>
            </div>
            <div class="field"><label for="image_url">이미지 URL</label><input class="input" id="image_url" name="image_url" type="url" autocomplete="off"><div class="field-error" id="image_url-error"></div></div>
            <div class="admin-form-actions">
              <button class="btn btn--secondary" type="button" data-reset>초기화</button>
              <button class="btn btn--danger" type="button" data-delete hidden>삭제</button>
              <button class="btn btn--primary" type="submit">저장</button>
            </div>
          </form>
        </section>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/admin-catalog.js"></script>
</body></html>
